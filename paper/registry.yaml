# 論文定理註冊表（A-4 PR-0）
#
# 每條 entry 是論文會指名引用的一條 Lean 定理。`lean_type` 是**人工輸入**的
# 型別快照：逐字取自原始檔的定理敘述（binder 在冒號前者改寫為前置 ∀/{}，
# 其餘不動），僅按 PaperIndex.lean 的 elaboration 環境（`open CollatzFST`）
# 補上相對命名空間前綴（`LP.`／`TwoMode.`／`L3.`／`Flow.`）。
#
# ⚠ 快照**不得**改為從原始檔自動抽取——自動抽取會讓重新生成靜默刷新快照，
#   「敘述未變」的強制就死了。原定理改到與快照不相容時 PaperIndex 編譯失敗，
#   唯一修法是改本檔，且該 PR 必須標【敘述變更】（AGENTS §2.6 [statement change]）。
#
# 生成器：tools/gen_paper_index.py（依 id 排序，決定性輸出
# Lean4RealConstruction/ProjectA/PaperIndex.lean 與 paper/theorem-index.tex）。
# 引用一致性：tools/check_paper_refs.py（\leanref ↔ registry 雙向）。
#
# 欄位：id（kebab-case，論文引用的穩定 ID）／lean（Lean 全名）／file（原始檔）／
# lean_type（型別快照）／latex（論文敘述，寫作 PR 填）／unreferenced_ok／
# reviewed（人工審核七欄，寫作 PR 填「姓名/日期」）。

