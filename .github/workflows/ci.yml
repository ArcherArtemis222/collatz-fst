# 完整建置。用 lean-action 裝 elan + 抓 mathlib cache，但 build 自己跑，
# 這樣才能把 log 留下來檢查有沒有人偷留 sorry。
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: 裝 elan、抓 mathlib olean cache
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: "true"
          build: "false"      # 下面自己跑，才拿得到 log
          test: "false"
          lint: "false"

      - name: lake build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: 禁止 sorry（用 Lean 自己的警告，不用猜）
        run: |
          if grep -n "declaration uses 'sorry'" build.log; then
            echo "::error::上面這些宣告用了 sorry。本 repo 的紅線是 0 個。"
            exit 1
          fi
          echo "沒有任何宣告使用 sorry。"

      - name: 把主定理的公理基底貼進 summary
        if: always()
        run: |
          {
            echo '## 信任基底（Audit.lean 的 #print axioms）'
            echo '```'
            grep -A1 "depends on axioms" build.log || echo '(build.log 裡沒有找到，可能 build 沒跑完)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保留 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
