# 秒級守衛：不裝 Lean，只檢查「有沒有人越界」。CI 的第一道閘門。
name: guard

on:
  push:
  pull_request:

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 匯入邊界（資料夾所有權的機器版）
        run: python3 scripts/check_boundaries.py

  pins:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 依賴釘選未經授權不得變動
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE" "$HEAD" -- lean-toolchain lakefile.toml lake-manifest.json || true)"
          if [ -n "$changed" ]; then
            echo "此 PR 動到了依賴釘選："
            echo "$changed"
            if ! printf '%s' "$LABELS" | tr ',' '\n' | grep -qx deps; then
              echo
              echo "::error::mathlib / toolchain 一動，全部 Farkas 憑證的 decide 引理都可能失效。"
              echo "::error::確定要改，請給這個 PR 貼上 'deps' 標籤，並在說明裡寫清楚重建結果。"
              exit 1
            fi
            echo "已貼 deps 標籤，放行。"
          else
            echo "依賴釘選未變動。"
          fi

  certs:
    # 把 Lean 裡寫死的數字綁回獨立重算。兩支都是秒級，所以每次 push 都跑。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy sympy
      - name: 重算 Farkas 憑證並與 Lean 對帳
        run: python3 tools/certificates.py
      - name: 終末流量平衡的精確整數重算（論文 §6 exact-integer 錨；B1.5 資料點 1）
        # 此 .github 變更經專案主人具名授權（B1.5 PR）：修補論文 §6 錨的 CI 覆蓋缺口。
        run: python3 tools/b15_terminal_balance.py
      - name: 重算 A-3 泛函秩並與 Lean 邊表對帳
        # ROADMAP A-3 寫進了具體秩數字（10 / 8 / 2 / 7 條秩 6 / 合併秩 8）。
        # 沒有這一步，那些數字在 repo 裡沒有任何東西能重現——就是 W₁₂/W₂₀ 的失敗模式。
        run: python3 tools/a3_functionals.py
      - name: Level 3 偵察數字（14 狀態 / 28 邊 / 終末 2 個 / 31 維 / 缺 1 條）
        # 這批數字在寫 Lean 之前就先釘住。約 15 秒（秩計算為主）。
        run: python3 tools/l3_recon.py
      - name: Level 3 Dim 檔的再生性（生成器輸出必須與 repo 逐位一致）
        # DimUpper / DimLower 是機械生成的（改生成器不改手寫）。這一步保證
        # repo 裡的 Lean 檔真的能由錨資料重現，而不只是檔頭的宣稱。
        run: |
          python3 tools/gen_l3dim.py
          git diff --exit-code -- \
            Lean4RealConstruction/ProjectA/Collatz_FST_L3_DimUpper.lean \
            Lean4RealConstruction/ProjectA/Collatz_FST_L3_DimLower.lean
      - name: Paper registry 的再生性（PaperIndex / theorem-index 必須與 repo 逐位一致）
        # PaperIndex.lean 的型別快照住在 paper/registry.yaml（人工輸入、diff 可審），
        # 生成器只搬運不抽取；快照與原定理的相容性由 lake build 的 kernel 檢查承擔。
        # 此 .github 變更經專案主人具名授權（A-4 PR-0）。
        run: |
          pip install pyyaml
          python3 tools/gen_paper_index.py
          git diff --exit-code -- \
            Lean4RealConstruction/ProjectA/PaperIndex.lean \
            paper/theorem-index.tex
      - name: 論文引用一致性（\leanref ↔ registry 雙向）
        # 每個 \leanref{ID} 都要在 registry；每條 registry 都要被引用或標
        # unreferenced_ok（paper/ 尚無非生成 .tex 原始檔時此方向跳過並印明原因）。
        run: |
          pip install pyyaml
          python3 tools/check_paper_refs.py
